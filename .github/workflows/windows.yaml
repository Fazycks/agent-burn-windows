name: Windows app

on:
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "rust/**"
      - ".github/workflows/windows.yaml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "rust/**"
      - ".github/workflows/windows.yaml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        shell: bash
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            apps/windows/src-tauri

      - run: pnpm install --frozen-lockfile --filter agent-burn-windows...

      - name: Build bundled CLI
        working-directory: apps/windows
        run: node scripts/sidecar.mjs

      - name: Build installer
        working-directory: apps/windows
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: agent-burn-windows
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach installer to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" apps/windows/src-tauri/target/release/bundle/nsis/*.exe --clobber
